<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" role="img" aria-labelledby="t d">
  <title id="t">GearSensor firmware architecture</title>
  <desc id="d">Block diagram of the Rust firmware, one 5 ms control loop. Inputs from the neutral switch, mux status, LPS, output readback and VREFINT pass through a thin hardware layer into a pure-logic crate with calibration, debounce, state machine, output controller and LED encoder. A constants file holds the measured resistor values. Outputs go through the DAC and op-amp to the gear output and to the LEDs, and the CAN transceiver stays silent.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #0d1117; }
    .cont { fill: none; stroke: #30363d; stroke-width: 1.5; }
    .box { fill: #161b22; stroke: #3fb9a3; stroke-width: 1.5; }
    .cbox { fill: #161b22; stroke: #7c9cff; stroke-width: 1.5; }
    .ttl { fill: #e6edf3; font-size: 14px; font-weight: 600; }
    .sub { fill: #8b98a8; font-size: 11px; }
    .lane { fill: #6e7b8b; font-size: 11px; letter-spacing: 1.5px; font-weight: 600; }
    .lbl { fill: #c9d4e0; font-size: 11px; }
    .head { fill: #e6edf3; font-size: 18px; font-weight: 600; }
    .sg { stroke: #3fb9a3; stroke-width: 2.5; fill: none; }
    .bus { stroke: #7c9cff; stroke-width: 2.5; fill: none; }
    .cfg { stroke: #7c9cff; stroke-width: 2.5; fill: none; }
    .flow { stroke-dasharray: 7 9; animation: dash 1.1s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <defs>
    <marker id="as" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fb9a3"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7c9cff"/></marker>
  </defs>
  <rect class="bg" width="1200" height="830" rx="14"/>
    <text class="head" x="40" y="34">GearSensor firmware - Rust, embassy-stm32, one 5 ms control loop</text>
  <rect class="box" x="40" y="56" width="200" height="54" rx="8"/>
  <text class="ttl" x="54" y="78">Neutral switch</text>
  <text class="sub" x="54" y="96">PB2, internal pull-up</text>
  <rect class="box" x="270" y="56" width="200" height="54" rx="8"/>
  <text class="ttl" x="284" y="78">Mux status</text>
  <text class="sub" x="284" y="96">PA2, high = car, low = USB</text>
  <rect class="box" x="500" y="56" width="200" height="54" rx="8"/>
  <text class="ttl" x="514" y="78">LPS signal</text>
  <text class="sub" x="514" y="96">PA0, divider R5 / R6</text>
  <rect class="box" x="730" y="56" width="200" height="54" rx="8"/>
  <text class="ttl" x="744" y="78">Output readback</text>
  <text class="sub" x="744" y="96">PA1, divider R14 / R15</text>
  <rect class="box" x="960" y="56" width="200" height="54" rx="8"/>
  <text class="ttl" x="974" y="78">VREFINT</text>
  <text class="sub" x="974" y="96">ADC channel 17, real VDDA</text>
  <rect class="cont" x="30" y="130" width="1140" height="112" rx="12"/>
  <text class="lane" x="1154" y="232" text-anchor="end">FIRMWARE CRATE - HARDWARE LAYER IN, NO DECISIONS</text>
  <rect class="box" x="60" y="158" width="410" height="52" rx="8"/>
  <text class="ttl" x="74" y="180">board</text>
  <text class="sub" x="74" y="198">GPIO reads and pin map; PA13 / PA14 never touched</text>
  <rect class="box" x="500" y="158" width="640" height="52" rx="8"/>
  <text class="ttl" x="514" y="180">analog</text>
  <text class="sub" x="514" y="198">ADC scan of IN0, IN1, IN17 four times, averaged; sample time 71.5 cycles</text>
  <path class="sg flow" d="M140 110 V158" marker-end="url(#as)"/>
  <path class="sg flow" d="M370 110 V158" marker-end="url(#as)"/>
  <path class="sg flow" d="M600 110 V158" marker-end="url(#as)"/>
  <path class="sg flow" d="M830 110 V158" marker-end="url(#as)"/>
  <path class="sg flow" d="M1060 110 V158" marker-end="url(#as)"/>
  <rect class="cont" x="30" y="262" width="1140" height="312" rx="12"/>
  <text class="lane" x="1154" y="284" text-anchor="end">GPS-CORE CRATE - PURE LOGIC, NO HARDWARE TYPES, TESTED ON THE PC</text>
  <rect class="box" x="60" y="292" width="196" height="96" rx="8"/>
  <text class="ttl" x="74" y="314">cal</text>
  <text class="sub" x="74" y="332">counts to mV, VDDA from</text>
  <text class="sub" x="74" y="348">VREFINT, LPS and readback</text>
  <text class="sub" x="74" y="364">volts, DAC code</text>
  <rect class="box" x="281" y="292" width="196" height="96" rx="8"/>
  <text class="ttl" x="295" y="314">debounce</text>
  <text class="sub" x="295" y="332">15 ms on the LPS and</text>
  <text class="sub" x="295" y="348">the neutral switch</text>
  <rect class="box" x="502" y="292" width="196" height="96" rx="8"/>
  <text class="ttl" x="516" y="314">fsm</text>
  <text class="sub" x="516" y="332">UNKNOWN, ARMED,</text>
  <text class="sub" x="516" y="348">WAIT_RELEASE, FAULT;</text>
  <text class="sub" x="516" y="364">trust model, reason codes</text>
  <rect class="box" x="723" y="292" width="196" height="96" rx="8"/>
  <text class="ttl" x="737" y="314">outctl</text>
  <text class="sub" x="737" y="332">feed-forward code plus</text>
  <text class="sub" x="737" y="348">RAM trim from readback;</text>
  <text class="sub" x="737" y="364">output fault check</text>
  <rect class="box" x="944" y="292" width="196" height="96" rx="8"/>
  <text class="ttl" x="958" y="314">led</text>
  <text class="sub" x="958" y="332">state to 12 LED die</text>
  <text class="sub" x="958" y="348">values, lamp test</text>
  <path class="sg flow" d="M257 340 H277" marker-end="url(#as)"/>
  <path class="sg flow" d="M478 340 H498" marker-end="url(#as)"/>
  <path class="sg flow" d="M699 340 H719" marker-end="url(#as)"/>
  <path class="sg flow" d="M520 210 V250 H158 V292" marker-end="url(#as)"/>
  <path class="sg flow" d="M379 210 V292" marker-end="url(#as)"/>
  <path class="sg flow" d="M450 210 V244 H600 V292" marker-end="url(#as)"/>
  <path class="sg flow" d="M158 388 V402 H770 V388" marker-end="url(#as)"/>
  <text class="lbl" x="300" y="416" text-anchor="middle">readback volts</text>
  <path class="sg flow" d="M650 388 V414 H1000 V388" marker-end="url(#as)"/>
  <text class="lbl" x="745" y="428" text-anchor="middle">mode, gear, reason</text>
  <rect class="box" x="60" y="440" width="230" height="62" rx="8"/>
  <text class="ttl" x="74" y="462">gear</text>
  <text class="sub" x="74" y="480">voltage table, shift order</text>
  <text class="sub" x="74" y="496">1,N,2,3,4,5,6</text>
  <rect class="box" x="310" y="440" width="230" height="62" rx="8"/>
  <text class="ttl" x="324" y="462">fault</text>
  <text class="sub" x="324" y="480">reason codes 1-7 and</text>
  <text class="sub" x="324" y="496">small warning set</text>
  <rect class="box" x="560" y="440" width="230" height="62" rx="8"/>
  <text class="ttl" x="574" y="462">units</text>
  <text class="sub" x="574" y="480">newtypes for mV, counts,</text>
  <text class="sub" x="574" y="496">DAC codes, milliseconds</text>
  <rect class="cbox" x="60" y="514" width="730" height="50" rx="8"/>
  <text class="ttl" x="74" y="536">config.rs</text>
  <text class="sub" x="74" y="554">R5 R6 R11 R12 R14 R15 R29 R30 R10, R_ECU, VDDA trim, tunables; nominal defaults, edit and reflash</text>
  <rect class="box" x="860" y="514" width="180" height="50" rx="8"/>
  <text class="ttl" x="874" y="536">tests</text>
  <text class="sub" x="874" y="554">cargo test on the PC</text>
  <rect class="cont" x="30" y="590" width="1140" height="100" rx="12"/>
  <text class="lane" x="46" y="612">FIRMWARE CRATE - HARDWARE LAYER OUT, SAME LOOP</text>
  <rect class="box" x="60" y="626" width="196" height="54" rx="8"/>
  <text class="ttl" x="74" y="648">can silent</text>
  <text class="sub" x="74" y="666">PB1 high, PB9 input, off</text>
  <rect class="box" x="281" y="626" width="196" height="54" rx="8"/>
  <text class="ttl" x="295" y="648">wdg</text>
  <text class="sub" x="295" y="666">IWDG, 50 to 100 ms</text>
  <rect class="box" x="502" y="626" width="196" height="54" rx="8"/>
  <text class="ttl" x="516" y="648">clocks</text>
  <text class="sub" x="516" y="666">24 MHz HSE, PLL to 48 MHz</text>
  <rect class="box" x="723" y="626" width="196" height="54" rx="8"/>
  <text class="ttl" x="737" y="648">analog DAC</text>
  <text class="sub" x="737" y="666">DAC1, buffer off, write code</text>
  <rect class="box" x="944" y="626" width="196" height="54" rx="8"/>
  <text class="ttl" x="958" y="648">leds</text>
  <text class="sub" x="958" y="666">12 open-drain pins, 10 ms</text>
  <path class="sg flow" d="M840 388 V626" marker-end="url(#as)"/>
  <path class="sg flow" d="M1060 388 V626" marker-end="url(#as)"/>
  <rect class="box" x="60" y="722" width="196" height="50" rx="8"/>
  <text class="ttl" x="74" y="744">CAN bus</text>
  <text class="sub" x="74" y="762">transceiver silent</text>
  <rect class="box" x="723" y="722" width="196" height="50" rx="8"/>
  <text class="ttl" x="737" y="744">GEAR_OUT</text>
  <text class="sub" x="737" y="762">op-amp, J3 pin 3, read on PA1</text>
  <rect class="box" x="944" y="722" width="196" height="50" rx="8"/>
  <text class="ttl" x="958" y="744">6 bicolour LEDs</text>
  <text class="sub" x="958" y="762">4 gear, status, neutral</text>
  <path class="sg flow" d="M840 680 V722" marker-end="url(#as)"/>
  <path class="sg flow" d="M1060 680 V722" marker-end="url(#as)"/>
  <path class="bus flow" d="M158 680 V722" marker-end="url(#ab)"/>
  <g transform="translate(40 806)"><path class="sg" d="M0 6 H28"/><text class="lbl" x="36" y="10">data flow</text><path class="cfg" d="M120 6 H148"/><text class="lbl" x="156" y="10">configuration</text><text class="lbl" x="300" y="10">Bring-up: probe-rs over SWD or the Tag-Connect, DFU over USB with BOOT0.</text></g>
</svg>
