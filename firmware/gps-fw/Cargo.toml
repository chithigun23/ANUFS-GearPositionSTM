[package]
name = "gps-fw"
version = "0.1.0"
edition = "2024"
description = "Gear position sensor firmware for the STM32F072CB board (Embassy)"
license = "MIT"
publish = false

[[bin]]
name = "gps-fw"
path = "src/main.rs"
test = false
bench = false

[dependencies]
gps-core = { path = "../gps-core", features = ["defmt"] }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.7"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
# unstable-pac: the DAC output-buffer bit (BOFF1) and the reset-cause flags have no HAL API on the F0.
embassy-stm32 = { version = "0.6.0", features = ["stm32f072cb", "time-driver-any", "memory-x", "defmt", "unstable-pac"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-1_000_000"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
